name: campustoday_app
description: CampusToday mobile app — student, teacher, and admin portals.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  firebase_messaging: ^15.2.4
  local_auth: ^2.3.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  fl_chart: ^0.70.2
  file_picker: ^8.3.7
  sqflite: ^2.4.2
  intl: ^0.20.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
